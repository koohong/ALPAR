[workspace]
name = "alpar"
version = "0.1.0"
description = "Automated Learning Pipeline for Antimicrobial Resistance"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12"
pandas = "*"
numpy = "*"
psutil = "*"
biopython = "*"
joblib = "*"
tqdm = "*"
pip = "*"
pyarrow = ">=25.0.0,<26"
matplotlib = ">=3.11.2,<4"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.4.0,<8"

[pypi-dependencies]
alpar = { path = ".", editable = true }

[tasks]
alpar = "alpar"

# Separate prefix so a Windows install does not replace the Linux `default` env.
[environments]
default = { solve-group = "default" }
notebook = { solve-group = "default" }
